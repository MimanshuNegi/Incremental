<div class="warehouse-container">
  <h2>Warehouse Registration</h2>

  <form [formGroup]="warehouseForm" (ngSubmit)="onSubmit()">

    <!-- Supplier ID -->
    <div class="form-group">
      <label>Supplier ID:</label>
      <input type="text" formControlName="supplierId" placeholder="Enter Supplier ID">
      <div *ngIf="submitted && f['supplierId'].errors" class="error">
        <small *ngIf="f['supplierId'].errors?.['required']">Supplier ID is required</small>
      </div>
    </div>

    <!-- Warehouse Name -->
    <div class="form-group">
      <label>Warehouse Name:</label>
      <input type="text" formControlName="warehouseName" placeholder="Enter Warehouse Name">
      <div *ngIf="submitted && f['warehouseName'].errors" class="error">
        <small *ngIf="f['warehouseName'].errors?.['required']">Warehouse Name is required</small>
      </div>
    </div>

    <!-- Location -->
    <div class="form-group">
      <label>Location:</label>
      <input type="text" formControlName="location" placeholder="Enter Location">
    </div>

    <!-- Capacity -->
    <div class="form-group">
      <label>Capacity:</label>
      <input type="number" formControlName="capacity" placeholder="Enter Capacity">
      <div *ngIf="submitted && f['capacity'].errors" class="error">
        <small *ngIf="f['capacity'].errors?.['required']">Capacity is required</small>
        <small *ngIf="f['capacity'].errors?.['min']">Capacity must be non‑negative</small>
      </div>
    </div>

    <button type="submit">Register Warehouse</button>
  </form>

  <!-- Backend error message -->
  <div *ngIf="backendError" class="error">
    {{ backendError }}
  </div>

  <!-- Success message -->
  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>
</div>
